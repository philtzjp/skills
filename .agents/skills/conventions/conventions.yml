# Issue、PR、コミットメッセージ、tag の書式の組織の規約の正本。
# 自分の .github/conventions.yml を持たないリポジトリは、すべてこのファイルに従う。
# 読むのは philtz-organizer-bot、各リポジトリの commit-msg hook が呼ぶ conventions スキル、Actions の conventions workflow。
# 検査器は philtzjp/organizer-bot の packages/conventions にある。規約の出典は philtzjp/skills の github スキルと、このリポジトリの .github のテンプレート。

commit:
    types: [feat, fix, perf, refactor, docs, style, test, chore, ci, build]
    # main に入るコミットだけに使う type。bot が squash で作るコミットと、移行前の merge commit に使う
    merge_type: merge
    # type(scope): 説明 の形にする。scope は必須
    scope: required
    # scope は変更したトップレベルのディレクトリ名にする。隠しディレクトリはドットを含める。
    # 下の親ディレクトリの中を変えたときは、その下のディレクトリ名にする。
    # 複数のディレクトリやリポジトリ直下のファイルにまたがるときは repo にする
    scope_from_paths: true
    leaf_parents: [apps, stacks, packages]
    repository_scope: repo
    # 説明は日本語で書く
    require_japanese: true
    # 1 行だけにし、本文を書かない
    single_line: true
    # 説明に #N を書かない
    forbid_issue_numbers: true
    # 説明にカッコを書かない
    forbid_parentheses: true
    # git が自動で付ける件名。ベースブランチを取り込んだときのマージコミットと、手元の fixup と squash を通す
    allowed_git_subjects:
        merge: "^Merge (branch|remote-tracking branch) "
        local_only: "^(fixup|squash)! "
    # 親のない最初のコミットの件名。philtz-organizer-bot がテンプレートから作ったリポジトリの最初のコミットをこの件名で作り直す
    initial_subject: "chore(repo): リポジトリを初期化"
    forbid_patterns:
        - pattern: "フェーズ|phase"
          message: 「フェーズ」「Phase」を使わず、具体的な変更内容を書く
        - pattern: "Claude-Session:|claude\\.ai/code|Generated (with|by) \\[?Claude Code"
          message: ツール由来の署名やセッション URL を書かない
    # 手元の commit-msg hook で、説明に中身があるかを claude -p で判定する。
    # claude が使えないときは codex exec で判定し、どちらもないときや判定に失敗したときは通す。CI では使わない
    semantic_lint:
        enabled: true
        model: claude-sonnet-5

tag:
    pattern: "^v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
    example: v1.2.3

# コミットメッセージ、タイトル、本文のすべてに共通する規約
common:
    forbid_co_authored_by: true
    forbid_patterns: []

# ツールが Issue、PR、コメントの本文に付けるフッター。検査では違反にし、organizer-bot が本文から取り除く。
# pattern は本文全体に当てる正規表現で、一致した部分をそのまま取り除く。本文の中でツールに触れた文は消さないよう、フッターの形だけに当てる
footers:
    - name: Claude Code
      # CLI は「🤖 Generated with [Claude Code](...)」、Web は「---」の下に「_Generated by [Claude Code](...)_」を付ける
      pattern: "(?:^|\\n)[ \\t]*(?:-{3,}[ \\t]*\\n(?:[ \\t]*\\n)*[ \\t]*)?(?:🤖[ \\t]*)?_?Generated (?:with|by) \\[Claude Code\\]\\([^)\\n]*\\)_?[ \\t]*(?=\\n|$)"
    - name: Claude Code のセッションの URL
      # URL だけの行か、Claude-Session: に続く行だけに当てる
      pattern: "(?:^|\\n)[ \\t]*(?:Claude-Session:[ \\t]*)?<?https://claude\\.ai/code/session_\\S*?>?[ \\t]*(?=\\n|$)"
    - name: Cursor
      # エージェントが作った PR の本文の終わりの印と、「Open in Web」「Open in Cursor」の画像リンク
      # 印はそれだけの行に、画像リンクは行の先頭の <div> に当てる
      pattern: "(?:^|\\n)[ \\t]*<!-- CURSOR_AGENT_PR_BODY_(?:BEGIN|END) -->[ \\t]*(?=\\n|$)|(?:^|\\n)[ \\t]*<div>\\s*<a href=\"https://cursor\\.com/(?:agents|background-agent)[\\s\\S]*?</div>[ \\t]*(?=\\n|$)"
    - name: Blacksmith
      # 飾りと 1 つのリンクだけでできた行に当てる
      pattern: "(?:^|\\n)[ \\t]*(?:<sub>)?[_*]?Powered by \\[?Blacksmith\\]?(?:\\([^)\\n]*\\))?[_*]?(?:</sub>)?[ \\t]*(?=\\n|$)"

# 中身によらず丸ごと消す bot のコメント
deleted_bot_comments: ["vercel[bot]"]

# コミットメッセージと、Issue と PR のタイトルに共通する規約
subject:
    # 署名の行の ✳︎ は本文にしか書かないので、件名では絵文字として扱う
    forbid_emoji: true

issue:
    # タイトルはコミットメッセージと同じ形にする
    title_like_commit: true
    # 先頭行の署名。✳︎ <会社名> <モデル名> <バージョン> の形にし、次の行は空ける
    signature:
        required: true
        pattern: "^✳︎ \\S+ \\S.*$"
        example: ✳︎ Anthropic Claude Opus 5.5
    # 必須の欄。書く順もこの順にする
    sections: [背景, 作業範囲, 受け入れ条件]
    # 任意の欄。書くなら必須の欄のあとに置く
    optional_sections: [備考]
    # この欄には - [ ] のタスクリストを 1 つ以上書く
    task_list_section: 受け入れ条件
    # この欄は、最初の行から - の箇条書きで書く
    list_sections: [背景]

pull_request:
    title_like_commit: true
    signature:
        required: true
        pattern: "^✳︎ \\S+ \\S.*$"
        example: ✳︎ Anthropic Claude Opus 5.5
    sections: [背景, 作業範囲, 受け入れ条件, 影響範囲・残リスク]
    optional_sections: [備考]
    task_list_section: 受け入れ条件
    # Closes #N などで Issue を自動で閉じない。日本語で書くため、Issue はマージ後に手で閉じる
    forbid_closing_keywords: true
